<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
  <div class="container">
    
    <!-- LOGO -->
    <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
      🛒 Sistema Ventas
    </a>

    <!-- TOGGLER -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- LINKS -->
    <div class7="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">

        <!-- PRODUCTOS -->
        <li class="nav-item">
          <a class="nav-link" th:href="@{/productos}">
            📦 Productos
          </a>
        </li>

        <!-- USUARIOS (SOLO ADMIN) -->
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/usuarios}">
            👤 Usuarios
          </a>
        </li>
		
		<!-- VENTAS -->
		<li class="nav-item">
		    <a class="nav-link" th:href="@{/ventas}">
		    💰 Ventas
		  </a>
		  
		</li>
		<li class="nav-item">
		    <a class="nav-link" th:href="@{/perfil}">
		        👤 Mi Perfil
		    </a>
		</li>


        <!-- DIVISOR -->
        <li class="nav-item d-none d-lg-block mx-2 text-secondary">|</li>

        <!-- LOGOUT -->
        <li class="nav-item">
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">
              🚪 Cerrar sesión
            </button>
          </form>
        </li>

      </ul>
    </div>

  </div>
</nav>

</body>
</html>
