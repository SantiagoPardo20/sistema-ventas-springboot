<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body style="
    background: linear-gradient(135deg, #1f2933, #111827);
">

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg border-0" style="width: 380px; border-radius: 14px;">

        <!-- HEADER -->
        <div class="card-header text-center text-white"
             style="background: linear-gradient(135deg, #111827, #1f2933);
                    border-top-left-radius: 14px;
                    border-top-right-radius: 14px;">
            <h4 class="mb-0 fw-semibold">
                <i class="bi bi-lock-fill me-1"></i> Sistema de Ventas
            </h4>
            <small class="text-secondary">Acceso seguro</small>
        </div>

        <!-- BODY -->
        <div class="card-body p-4">

            <form th:action="@{/login}" method="post">

                <!-- EMAIL -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="correo@ejemplo.com"
                               required>
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-key"></i>
                        </span>
                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="••••••••"
                               required>
                    </div>
                </div>

                <!-- BOTÓN -->
                <button type="submit"
                        class="btn btn-dark w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i>
                    Ingresar
                </button>
            </form>

            <!-- ERROR -->
            <div th:if="${param.error}"
                 class="alert alert-danger mt-3 text-center small">
                ❌ Usuario, contraseña incorrectos o cuenta desactivada
            </div>

            <!-- LOGOUT -->
            <div th:if="${param.logout}"
                 class="alert alert-success mt-3 text-center small">
                ✅ Sesión cerrada correctamente
            </div>

        </div>

        <!-- FOOTER -->
        <div class="card-footer text-center text-muted small">
            © Sistema de Ventas 202
        </div>

    </div>
</div>

</body>
</html>
