<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Mi Perfil</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{layout/navbar :: body}"></div>

<div class="container" style="margin-top: 90px;">

    <!-- INFO USUARIO -->
    <div class="card shadow mb-4">
        <div class="card-header bg-dark text-white">
            👤 Mi Perfil
        </div>
        <div class="card-body">
            <p><strong>Nombre:</strong> <span th:text="${usuario.nombre}"></span></p>
            <p><strong>Email:</strong> <span th:text="${usuario.email}"></span></p>
            <p>
                <strong>Rol:</strong>
                <span class="badge bg-dark" th:text="${usuario.rol}"></span>
            </p>
			<a th:href="@{/ventas/reporte/mis-ventas}"
			   target="_blank"
			   class="btn btn-outline-primary" sec:authorize="hasRole('EMPLEADO')">
			   📄 Descargar mis ventas (PDF)
			</a>
			<a th:href="@{/ventas/reporte/todas} "
			   target="_blank"
			   class="btn btn-danger" sec:authorize="hasRole('ADMIN')">
			   📊 Reporte general PDF
			</a>

        </div>
    </div>

    <!-- MIS VENTAS -->
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            🧾 Mis Ventas
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover text-center mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>

                        <tr th:each="v : ${ventas}">
                            <td th:text="${v.id}"></td>
                            <td th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="fw-bold text-success">
                                $ <span th:text="${v.total}"></span>
                            </td>
                            <td>
                                <a th:href="@{/ventas/detalle/{id}(id=${v.id})}"
                                   class="btn btn-info btn-sm">
                                   🔍 Detalles
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${ventas.empty}">
                            <td colspan="4" class="text-muted py-4">
                                Aún no has registrado ventas
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
