<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Producto</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<div th:replace="layout/navbar :: body"></div>

<!-- CONTENIDO -->
<div class="container" style="margin-top: 100px; max-width: 600px;">

    <div class="card shadow-lg border-0">
        <div class="card-header bg-dark text-white text-center">
            <h4 class="mb-0">
                <i class="bi bi-box-seam"></i>
                Gestión de Producto
            </h4>
        </div>

        <div class="card-body p-4">

            <form th:action="@{/productos/guardar}"
                  th:object="${producto}"
                  method="post">

                <input type="hidden" th:field="*{id}"/>

                <!-- NOMBRE -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-tag"></i> Nombre
                    </label>
                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control"
                           placeholder="Ej: Laptop HP"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                </div>
				<!-- DESCRIPCIÓN -->
				<div class="mb-3">
				    <label class="form-label fw-semibold">
				        <i class="bi bi-card-text"></i> Descripción
				    </label>

				    <textarea th:field="*{descripcion}"
				              class="form-control"
				              rows="3"
				              placeholder="Ej: Laptop 16GB RAM, SSD 512GB, Intel i5"
				              th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'">
				    </textarea>

				    <div class="invalid-feedback" th:errors="*{descripcion}"></div>
				</div>


                <!-- PRECIO -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-currency-dollar"></i> Precio
                    </label>
                    <input type="number"
                           step="0.01"
                           th:field="*{precio}"
                           class="form-control"
                           placeholder="Ej: 1200.00"
                           th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{precio}"></div>
                </div>

                <!-- STOCK -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-boxes"></i> Stock
                    </label>
                    <input type="number"
                           th:field="*{stock}"
                           class="form-control"
                           placeholder="Ej: 50"
                           th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{stock}"></div>
                </div>

                <!-- BOTONES -->
                <div class="d-flex justify-content-between">
                    <a th:href="@{/productos}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>

                    <button type="submit" class="btn btn-success px-4">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
