<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{layout/navbar :: body}"></div>

<!-- CONTENIDO -->
<div class="container" style="margin-top: 90px;">

    <div class="card shadow-lg border-0">

        <!-- HEADER -->
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">
                <i class="bi bi-people"></i> Usuarios
            </h5>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-success btn-sm">
                <i class="bi bi-plus-circle"></i> Nuevo Usuario
            </a>
        </div>

        <!-- BODY -->
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 text-center">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Activo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

					<tbody>
					<tr th:each="u : ${usuarios}">
					    <td th:text="${u.id}"></td>
					    <td th:text="${u.nombre}"></td>
					    <td th:text="${u.email}"></td>

					    <td>
					        <span class="badge bg-primary" th:text="${u.rol}"></span>
					    </td>

					    <!-- ESTADO -->
					    <td>
					        <span th:classappend="${u.activo} ? 'badge bg-success' : 'badge bg-danger'"
					              th:text="${u.activo ? 'Activo' : 'Inactivo'}">
					        </span>
					    </td>

					    <!-- ACCIONES -->
					    <td class="text-center">

					       

					        <!-- ACTIVAR / DESACTIVAR -->
					        <a th:href="@{/usuarios/estado/{id}(id=${u.id})}"
					           th:class="${u.activo} ? 'btn btn-outline-secondary btn-sm me-1' : 'btn btn-success btn-sm me-1'"
					           th:title="${u.activo} ? 'Desactivar' : 'Activar'">
					            <i th:class="${u.activo} ? 'bi bi-lock' : 'bi bi-unlock'"></i>
					        </a>

					        <!-- ELIMINAR -->
					        <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}"
					           class="btn btn-danger btn-sm"
					           onclick="return confirm('¿Eliminar usuario?')">
					            <i class="bi bi-trash"></i>
					        </a>

					    </td>
					</tr>

					<tr th:if="${usuarios.empty}">
					    <td colspan="6" class="text-muted py-4 text-center">
					        No hay usuarios registrados
					    </td>
					</tr>
					</tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
