<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{layout/navbar :: body}"></div>

<div class="container" style="margin-top: 90px;">

    <div class="card shadow-lg">
        <div class="card-header  bg-dark  text-white">
            <h5 class="mb-0">🔍 Detalle de Venta #<span th:text="${venta.id}"></span></h5>
        </div>

        <div class="card-body">

            <!-- INFO GENERAL -->
            <div class="mb-3">
                <strong>Fecha:</strong>
                <span th:text="${#temporals.format(venta.fecha,'dd/MM/yyyy HH:mm')}"></span>
            </div>

            <div class="mb-3">
                <strong>Total:</strong>
                <span class="text-success fw-bold">
                    $ <span th:text="${venta.total}"></span>
                </span>
            </div>

            <!-- TABLA DETALLES -->
            <table class="table table-bordered text-center mt-4">
                <thead class="table-dark">
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d : ${detalles}">
                        <td th:text="${d.producto.nombre}"></td>
                        <td>$ <span th:text="${d.precio}"></span></td>
                        <td th:text="${d.cantidad}"></td>
                        <td>
                            $ <span th:text="${d.precio * d.cantidad}"></span>
                        </td>
                    </tr>

                    <tr th:if="${detalles.empty}">
                        <td colspan="4" class="text-muted">
                            No hay detalles para esta venta
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="text-end">
                <a th:href="@{/ventas}" class="btn btn-secondary">
                    ⬅ Volver
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
