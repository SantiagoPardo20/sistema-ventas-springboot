<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{layout/navbar :: body}"></div>

<div class="container" style="margin-top: 90px;">
    <div class="card shadow-lg">

        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">🧾 Registrar Venta</h5>
        </div>

        <div class="card-body">

            <!-- 🔍 BUSCADOR (GET) -->
            <form method="get" th:action="@{/ventas/nueva}" class="mb-3">
                <div class="input-group">
                    <input type="text"
                           name="q"
                           class="form-control"
                           placeholder="🔎 Buscar producto por nombre"
                           th:value="${q}">
                    <button class="btn btn-outline-secondary">
                        Buscar
                    </button>
                </div>
            </form>

            <!-- ➕ AGREGAR AL CARRITO (POST) -->
            <form th:action="@{/ventas/agregar}" method="post" class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Producto</label>
                    <select name="productoId" class="form-select" required>
                        <option value="" disabled selected>
                            -- Seleccione un producto --
                        </option>
                        <option th:each="p : ${productos}"
                                th:value="${p.id}"
                                th:text="${p.nombre + ' (Stock: ' + p.stock + ')'}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Cantidad</label>
                    <input type="number" name="cantidad" class="form-control" min="1" required>
                </div>

                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-primary w-100">
                        ➕ Agregar
                    </button>
                </div>
            </form>

            <!-- 🛒 CARRITO -->
            <table class="table table-bordered mt-4 text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                        <th>Acción</th>
                    </tr>
                </thead>
				<tbody>
				<tr th:each="d, stat : ${carrito}">
				    <td th:text="${d.producto.nombre}"></td>

				    <td>
				        $ <span class="precio" th:text="${d.precio}"></span>
				    </td>

				    <!-- 🔢 CANTIDAD EDITABLE -->
				    <td>
				        <input type="number"
				               class="form-control cantidad"
				               min="1"
				               th:value="${d.cantidad}"
				               onchange="recalcularFila(this)">
				    </td>

				    <!-- 💵 SUBTOTAL DINÁMICO -->
				    <td>
				        $ <span class="subtotal"></span>
				    </td>

				    <td>
				        <form th:action="@{/ventas/quitar}" method="post">
				            <input type="hidden" name="index" th:value="${stat.index}">
				            <button class="btn btn-danger btn-sm">🗑️</button>
				        </form>
				    </td>
				</tr>

				<tr th:if="${carrito.empty}">
				    <td colspan="5" class="text-muted">
				        No hay productos agregados
				    </td>
				</tr>
				</tbody>

            </table>
			<div class="text-end mt-3">
			    <h5 class="fw-bold">
			        💰 Total: $
			        <span id="totalVenta">0.00</span>
			    </h5>
			</div>


            <!-- 💾 FINALIZAR -->
            <form th:action="@{/ventas/finalizar}" method="post" class="text-end">
                <button class="btn btn-success mt-3">
                    💾 Finalizar Venta
                </button>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function recalcularFila(input) {
    const fila = input.closest("tr");
    const precio = parseFloat(fila.querySelector(".precio").textContent);
    const cantidad = parseInt(input.value);

    const subtotal = precio * cantidad;
    fila.querySelector(".subtotal").textContent = subtotal.toFixed(2);

    calcularTotal();
}

function calcularTotal() {
    let total = 0;
    document.querySelectorAll(".subtotal").forEach(el => {
        total += parseFloat(el.textContent) || 0;
    });
    document.getElementById("totalVenta").textContent = total.toFixed(2);
}

// inicializa al cargar
document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".cantidad").forEach(input => {
        recalcularFila(input);
    });
});
</script>

</body>
</html>
